<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure Cart Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="kutu">
    <h1>Secure E-Commerce</h1>

    <div id="new-product-space" style="background-color: #ddd; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <h4 style="margin-top: 0;">Create Your Own Product</h4>
        <input type="text" id="new-product-name" placeholder="Product Name (e.g., Mouse)" style="padding: 5px; width: 40%; margin-bottom: 10px;">
        <input type="number" id="new-product-price" placeholder="Price" style="padding: 5px; width: 30%; margin-bottom: 10px;">
        <br>
        <button id="add-your-btn" class="test-btn" style="background-color: #007bff;">➕ Create Button</button>
    </div>

    <div class="products" id="products-box">
        <button id="apple-btn" class="product-btn">🍏 Add Apple (20 TL)</button>
        <button id="laptop-btn" class="product-btn">💻 Add Laptop (25,000 TL)</button>
    </div>

    <div class="result-screen">
        <h2>Total Due: <span id="balance-indicator">0</span> TL</h2>
        <p id="information-message">Start adding products to your cart...</p>
    </div>

    <hr>

    <div class="test-space">
        <button id="hacker-btn" class="test-btn">🏴‍☠️ Execute Hacker Attack</button>
        <button id="exit-btn" class="test-btn" style="background-color: darkred;">🗑️ Shut Down System</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
